<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unity WebGL | BSG</title>

  <link rel="stylesheet" href="TemplateData/style.css" />
  <link rel="shortcut icon" href="TemplateData/favicon.ico" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
    }

    /* Fixed visual size (Unity controls render size) */
    #unity-canvas {
      width: 960px;
      height: 600px;
      background: black;
      display: block;
    }

    #unity-loading-bar {
      position: absolute;
      bottom: 20px;
      width: 300px;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 10px;
      background: #222;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: #f4c430;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <script>
    /*****************************************************************
     * GLOBAL STATE GUARDS (CRITICAL)
     *****************************************************************/
    let unityInstance = null;
    let unityBooted = false;      // createUnityInstance resolved
    let unityAcceptingMessages = false; // enabled by C# after first frame

    /*****************************************************************
     * DOM REFERENCES
     *****************************************************************/
    const canvas = document.getElementById("unity-canvas");
    const loadingBar = document.getElementById("unity-loading-bar");
    const progressBarFull = document.getElementById("unity-progress-bar-full");

    /*****************************************************************
     * UNITY BUILD CONFIG
     *****************************************************************/
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/WebSocketTest.loader.js";

    const config = {
      dataUrl: buildUrl + "/WebSocketTest.data",
      frameworkUrl: buildUrl + "/WebSocketTest.framework.js",
      codeUrl: buildUrl + "/WebSocketTest.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "BSG",
      productVersion: "0.1.0",

      // Stability settings
      devicePixelRatio: 1,
      matchWebGLToCanvasSize: true,
    };

    /*****************************************************************
     * LOAD UNITY
     *****************************************************************/
    loadingBar.style.display = "block";

    const loaderScript = document.createElement("script");
    loaderScript.src = loaderUrl;

    loaderScript.onload = () => {
      createUnityInstance(
        canvas,
        config,
        (progress) => {
          progressBarFull.style.width = (progress * 100) + "%";
        }
      ).then((instance) => {
        unityInstance = instance;
        unityBooted = true;

        loadingBar.style.display = "none";

        console.log("[Unity] createUnityInstance resolved");

        // Notify host/parent that Unity EXISTS (not yet accepting input)
        try {
          const target =
            window.parent && window.parent !== window
              ? window.parent
              : window;

          target.postMessage({ type: "UNITY_READY" }, "*");
        } catch (e) {
          console.warn("UNITY_READY postMessage failed:", e);
        }

      }).catch((err) => {
        console.error("Unity failed to load:", err);
      });
    };

    document.body.appendChild(loaderScript);

    /*****************************************************************
     * MESSAGE HANDLING (HOST / SOCKET / CONTROLLERS → UNITY)
     *****************************************************************/
    window.addEventListener("message", (event) => {
      if (!event.data) return;

      // 🔒 HARD GATES
      if (!unityBooted) return;
      if (!unityAcceptingMessages) return;
      if (!unityInstance) return;

      // Prevent echo loops
      if (event.data.__fromUnity === true) return;

      // Explicit allow-list
      if (event.data.type !== "controller-input") return;

      try {
        unityInstance.SendMessage(
          "WebGLBridge",
          "OnControllerEvent",
          JSON.stringify(event.data)
        );
      } catch (e) {
        console.error("SendMessage failed:", e);
      }
    });

    /*****************************************************************
     * UNITY → JS CALLED FUNCTIONS
     * (called via Application.ExternalCall / JSImport)
     *****************************************************************/

    // Called from C# AFTER first frame
    window.UnityEnableMessages = () => {
      console.log("[Unity] Accepting external messages");
      unityAcceptingMessages = true;
    };

    // Optional: Unity → Host forwarding (safe, stamped)
    window.UnityPostToHost = (payloadJson) => {
      try {
        const payload = JSON.parse(payloadJson);
        payload.__fromUnity = true;

        const target =
          window.parent && window.parent !== window
            ? window.parent
            : window;

        target.postMessage(payload, "*");
      } catch (e) {
        console.error("UnityPostToHost failed:", e);
      }
    };
  </script>
</body>
</html>
